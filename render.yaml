# Render manifest for the wedding registry web service.
# The database is Neon PostgreSQL (provisioned separately, not by Render);
# its connection string is supplied through the DATABASE_URL env var.
# DATABASE_URL, ADMIN_PASSWORD and SESSION_SECRET are marked `sync: false`
# (set in the Render dashboard) and must be set before the service starts.

services:
  - type: web
    name: wedding-backend
    env: node
    region: oregon
    plan: starter
    branch: main
    healthCheckPath: /api/health
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
